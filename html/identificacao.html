            <section class="card form-card">
                <form id="registroAnimalForm">
                    
                    <div class="form-section">
                        <h3 class="section-title">Origem e Saúde</h3>
                        
                        <label class="checkbox-container">
                            <input type="checkbox" name="nasceu_fazenda">
                            <span class="checkmark"></span>
                            Nasceu em sua fazenda?
                        </label>

                        <label class="checkbox-container">
                            <input type="checkbox" name="vacinado">

                        </label>
                    </div>

                    <div class="form-section">
                        <label class="setting-label">É Ovino ou Caprino?</label>
                        <div class="options-row">
                            <button type="button" class="option-btn active" data-group="especie" data-value="caprino">Caprino</button>
                            <button type="button" class="option-btn" data-group="especie" data-value="ovino">Ovino</button>
                        </div>
                    </div>

                    <div class="form-section">
                        <label class="setting-label">É Macho ou Fêmea?</label>
                        <div class="options-row">
                            <button type="button" class="option-btn active" data-group="sexo" data-value="macho">Macho</button>
                            <button type="button" class="option-btn" data-group="sexo" data-value="femea">Fêmea</button>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Peso (Kg)</label>
                            <input type="number" class="form-control" placeholder="0.00" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>Idade</label>
                            <input type="text" class="form-control" placeholder="Informe a idade">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Está em tratamento? (Se sim, qual?)</label>
                        <input type="text" class="form-control" placeholder="Descreva o tratamento ou deixe vazio">
                    </div>

                    <div class="form-group">
                        <label>Está prenha? (Se sim, quanto tempo?)</label>
                        <input type="text" class="form-control" placeholder="Informe somente se houver gestação">
                    </div>

                    <div class="form-group">
                        <label>Número do brinco, tatuagem ou microchip</label>
                        <input type="text" class="form-control" placeholder="Identificador único">
                    </div>

                    <div class="form-group">
                        <label>Raça</label>
                        <input type="text" class="form-control" placeholder="Informe a raça">
                    </div>

                    <div class="form-group">
                        <label>Está em qual lote?</label>
                        <select class="form-control">
                            <option value="">Nenhum lote cadastrado ainda</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Número Identificador da Matriz e do Reprodutor</label>
                        <input type="text" class="form-control" placeholder="Pai e Mãe">
                    </div>

                    <div class="form-group">
                        <label>Informações extras / Observações</label>
                        <textarea class="form-control" rows="4" placeholder="Algum detalhe relevante..."></textarea>
                    </div>

                        <button type="submit" class="btn btn-primary btn-block">Salvar Identificação</button>
                        <button type="reset" class="btn btn-outline btn-block">Limpar Campos</button>
