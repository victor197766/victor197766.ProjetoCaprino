<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ControlCabra - Cadastro</title>
    <link rel="stylesheet" href="recuperarConta2.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-wrapper">
                <img src="logoControlCabra.png" alt="Logo ControlCabra - Cabra, Ovelha e Fazenda" class="logo-img">
            </div>
            <p>ControlCabra - Caprinovinocultura</p>
        </header>

        <section id="register-choice-section" class="form-section active">
            <h2>Como você vai usar o sistema?</h2>
            <p class="instruction">Escolha o seu perfil para personalizarmos a sua experiência.</p>
            
            <div class="profile-cards">
                <button type="button" class="profile-card" id="btn-choice-farmer">
                    <div class="icon">🚜</div>
                    <div class="info">
                        <h3>Sou Produtor</h3>
                        <p>Quero registrar minha fazenda e gerenciar meu rebanho.</p>
                    </div>
                </button>

                <button type="button" class="profile-card" id="btn-choice-visitor">
                    <div class="icon">👀</div>
                    <div class="info">
                        <h3>Sou Visitante</h3>
                        <p>Quero apenas explorar o sistema e ver informações.</p>
                    </div>
                </button>
            </div>

            <div class="actions">
                <a href="recuperarConta.html" class="text-link secondary">Cancelar e voltar para o Login</a>
            </div>
        </section>

        <section id="register-farmer-section" class="form-section hidden">
            <h2>Cadastro de Produtor</h2>
            <form id="register-farmer-form" method="POST" action="registerService.php">
                <div class="input-group">
                    <label for="farm-name">Nome Completo</label>
                    <input type="text" name="farm-name" id="farm-name" placeholder="Ex: João da Silva" required>
                </div>
                <div class="input-group">
                    <label for="farm-property">Nome da Propriedade</label>
                    <input type="text" name="farm-property" id="farm-property" placeholder="Ex: Sítio das Cabras" required>
                </div>
                <div class="input-group">
                    <label for="farm-email">E-mail</label>
                    <input type="email" name="farm-email" id="farm-email" placeholder="produtor@email.com" required>
                </div>
                <div class="input-group">
                    <label for="farm-password">Senha</label>
                    <input type="password" name="farm-password" id="farm-password" placeholder="Crie uma senha forte" required>
                </div>
                <div class="actions">
                    <button type="submit" class="btn primary">Criar Conta de Produtor</button>
                    <a href="#" id="back-choice-from-farmer" class="text-link secondary">Voltar aos perfis</a>
                </div>
            </form>
        </section>

        <section id="register-visitor-section" class="form-section hidden">
            <h2>Cadastro de Visitante</h2>
            <form id="register-visitor-form" method="POST" action="registerService.php">
                <div class="input-group">
                    <label for="vis-name">Nome Completo</label>
                    <input type="text" name="vis-name" id="vis-name" placeholder="Ex: Maria Souza" required>
                </div>
                <div class="input-group">
                    <label for="vis-email">E-mail</label>
                    <input type="email" name="vis-email" id="vis-email" placeholder="visitante@email.com" required>
                </div>
                <div class="input-group">
                    <label for="vis-password">Senha</label>
                    <input type="password" name="vis-password" id="vis-password" placeholder="Crie uma senha" required>
                </div>
                <div class="actions">
                    <button type="submit" class="btn primary">Criar Conta de Visitante</button>
                    <a href="#" id="back-choice-from-visitor" class="text-link secondary">Voltar aos perfis</a>
                </div>
            </form>
        </section>
    </div>

    <script>
        // Mapeamento das seções exclusivas de cadastro
        const sections = {
            choice: document.getElementById('register-choice-section'),
            farmer: document.getElementById('register-farmer-section'),
            visitor: document.getElementById('register-visitor-section')
        };

        // Função universal para trocar de tela
        function showSection(sectionName) {
            // Esconde todas as seções
            Object.values(sections).forEach(sec => {
                if(sec) {
                    sec.classList.remove('active');
                    sec.classList.add('hidden');
                }
            });
            // Mostra apenas a desejada
            if(sections[sectionName]) {
                sections[sectionName].classList.remove('hidden');
                sections[sectionName].classList.add('active');
            }
        }

        // Escolha de Perfil -> Exibe os formulários correspondentes
        document.getElementById('btn-choice-farmer').addEventListener('click', () => { 
            showSection('farmer'); 
        });
        
        document.getElementById('btn-choice-visitor').addEventListener('click', () => { 
            showSection('visitor'); 
        });

        // Voltar dos formulários para a tela de escolha de perfis
        document.getElementById('back-choice-from-farmer').addEventListener('click', (e) => { 
            e.preventDefault(); 
            showSection('choice'); 
        });
        
        document.getElementById('back-choice-from-visitor').addEventListener('click', (e) => { 
            e.preventDefault(); 
            showSection('choice'); 
        });
    </script>
</body>
</html>
